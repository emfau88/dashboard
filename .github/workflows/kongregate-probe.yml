name: Probe Kongregate metrics

on:
  push:
    branches: [feature/kongregate-daily-metrics]
    paths:
      - '.github/workflows/kongregate-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public metrics feeds
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, json
          games = ('hexfront', 'galalaxy', 'roosterrage-survivor')
          for slug in games:
              for prefix in ('https://www.kongregate.com/games/emfau/', 'https://www.kongregate.com/en/games/emfau/'):
                  url = prefix + slug + '/metrics.json'
                  print('TEST', url, flush=True)
                  req = urllib.request.Request(url, headers={'User-Agent':'EmfauGameOps/1.0 (+https://github.com/emfau88/dashboard)', 'Accept':'application/json'})
                  try:
                      with urllib.request.urlopen(req, timeout=12) as r:
                          body = r.read(2048).decode('utf-8', 'replace')
                          print('HTTP', r.status, 'TYPE', r.headers.get('Content-Type'), 'FINAL',r.geturl())
                          try:
                              value = json.loads(body)
                              print('JSON SAMPLE',str(value)[:700])
                          except ValueError:
                              print('BODY SAMPLE',body[:200].replace('\\n',' '))
                  except urllib.error.HTTPError as e:
                      print('HTTP ERROR',e.code,'TYPE',e.headers.get('Content-Type'),'REDIRECT',e.geturl())
                  except Exception as e:
                      print('REQUEST ERROR',type(e).__name__,str(e)[:250])
          PY

name: Probe Kongregate metrics
on:
  push:
    branches: [feature/kongregate-daily-metrics]
    paths:
      - '.github/workflows/kongregate-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public metrics fields
        run: |
          python - <<'PY'
          import urllib.request, json
          for slug in ('hexfront','galalaxy','roosterrage-survivor'):
              url='https://www.kongregate.com/games/emfau/'+slug+'/metrics.json'
              with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'EmfauGameOps/1.0','Accept':'application/json'}), timeout=12) as r:
                  value=json.load(r)
                  print(slug,'KEYS',sorted(value))
                  print(slug,'GAMEPLAYS',value.get('gameplays_count'),'FAVORITES',value.get('favorites_count'))
                  print(slug,'GAME_STATISTICS',str(value.get('game_statistics',''))[:1600].replace('\\n',' '))
          PY

name: Game-Ops-Dashboard veröffentlichen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Dashboard-Daten prüfen
        run: node scripts/validate-data.mjs

      - name: Statische Seite vorbereiten
        run: |
          mkdir _site
          cp index.html data.json _site/

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5

name: Y8 public metrics feasibility probe

on:
  push:
    branches: [feature/y8-metrics-probe]
    paths:
      - '.github/workflows/y8-metrics-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-public-page:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test public Y8 play-page data (no login)
        run: |
          python - <<'PY'
          import urllib.request, urllib.error, re, html
          url = 'https://www.y8.com/games/galalaxy'
          request = urllib.request.Request(url, headers={
              'User-Agent':'Mozilla/5.0 (compatible; emfau-metrics/1.0; +https://github.com/emfau88/dashboard)',
              'Accept':'text/html,application/xhtml+xml',
              'Accept-Language':'en-US,en;q=0.8'
          })
          try:
              with urllib.request.urlopen(request, timeout=20) as result:
                  data = result.read(2_000_000).decode('utf-8', 'replace')
                  print('STATUS:', result.status)
                  print('URL:', result.geturl())
                  print('BYTES:', len(data))
                  print('CONTENT-TYPE:', result.headers.get('Content-Type'))
              for term in ['play times','galalaxy','Like','rating','views_count','play_count']:
                  matches=list(re.finditer(re.escape(term), data, flags=re.I))
                  print('MATCH', repr(term), 'COUNT', len(matches))
                  for m in matches[:4]:
                      region=data[max(0,m.start()-180):m.end()+120]
                      print('CONTEXT:', re.sub(r'\\s+',' ',region)[:470])
              plain=html.unescape(re.sub(r'<[^>]+>', ' ', data))
              plain=re.sub(r'\\s+',' ',plain)
              for m in list(re.finditer('play times',plain,re.I))[:3]:
                  print('TEXT CONTEXT:', plain[max(0,m.start()-110):m.end()+90])
          except Exception as error:
              print('PROBE ERROR', type(error).__name__, str(error))
              raise
          PY
